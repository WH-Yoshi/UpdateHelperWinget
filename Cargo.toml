[package]
name = "WinGetInterfacer"
version = "0.1.4"
edition = "2021"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
eframe = "0.35.0"
egui = "0.35.0"
poll-promise = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
open = "5.3.2"

[target.'cfg(windows)'.dependencies]
winapi = "0.3.9"
