[package]
name = "NewPackageLister"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[build]
target = "x86_64-pc-windows-msvc"

[dependencies]
eframe = "0.32.0"
egui = "0.32.0"
poll-promise = "0.3.0"
windows = { version = "0.61.3", features = ["Win32_System_Threading"] }