name: Manual Semantic Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      # Exemples de tags reconnus : v1.0.0, v1.0.0-rc.1, v2.5.3

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches tag
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | awk -F '"' '{print $2}')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: v$CARGO_VERSION"
          if [ "v$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Cargo.toml version ($CARGO_VERSION) does not match Git tag ($TAG_VERSION). Aborting release."
            exit 1
          fi

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust project
        run: cargo build --release

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          # tag_name est automatiquement le tag qui a déclenché le workflow (ex: v1.0.0)
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true

          # Les fichiers à joindre à la release (ton exécutable Rust)
          files: |
            target/release/NewPackageLister.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}